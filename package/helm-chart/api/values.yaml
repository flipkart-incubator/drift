image:
  registry: docker.io
  repository: your-org/drift-api
  tag: latest
  pullPolicy: IfNotPresent
  runAsUser: 1000

replicas: 2

namespace: drift

labels:
  app: drift-api
  component: api
  managed-by: helm

selectorLabels:
  app: drift-api
  component: api

resources:
  requests:
    memory: 2G
    cpu: 2
  limits:
    memory: 2G
    cpu: 2

env:
  REDIS_PASSWORD: "your-redis-password"
  REDIS_MASTER: "your-redis-master"
  REDIS_SENTINELS: "your-redis-sentinel:26379"
  REDIS_PREFIX: "drift"
  REDIS_DATABASE: "0"
  HBASE_CONFIG_BUCKET: "file:////usr/share/drift-api/config/hbase.properties"
  TEMPORAL_FRONTEND: "your-temporal-frontend:7233"
  TEMPORAL_TASK_QUEUE: "DRIFT_QUEUE"
  HADOOP_USERNAME: "your-hadoop-username"
  HADOOP_LOGIN_USER: "your-hadoop-login-user"
  ZOOKEEPER_QUORUM_HOT: "your-zookeeper-quorum"
  # Set to false to disable Redis and use DNS fanout for cache invalidation instead
  REDIS_ENABLED: ""
  # DNS name of the worker headless service for cache invalidation fanout (used when REDIS_ENABLED=false).
  # Format: <worker-release-name>-headless.<namespace>.svc.cluster.local
  WORKER_HEADLESS_HOST: ""
  # Admin port of the worker pods (must match the worker's adminConnectors port)
  WORKER_ADMIN_PORT: ""

jvm:
  heapSize:
    xms: "1g"
    xmx: "1g"
